<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/LogStudio_Logo.ico" />
    <link rel="icon" type="image/png" href="/LogStudio_Logo.png" />
    <title>LogStudio</title>
    <style>
      /* Instant boot splash before React mounts */
      html, body {
        margin: 0;
        height: 100%;
        background: #0d1117;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10001;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse 80% 60% at 50% 35%, rgba(88, 166, 255, 0.12), transparent 60%),
          #0d1117;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        color: #c9d1d9;
        transition: opacity 0.25s ease;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #boot-splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      #boot-splash .boot-brand {
        font-size: 24px;
        font-weight: 700;
        color: #e6edf3;
      }
      #boot-splash .boot-spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(88, 166, 255, 0.2);
        border-top-color: #58a6ff;
        border-radius: 50%;
        animation: boot-spin 0.75s linear infinite;
      }
      #boot-splash .boot-status {
        margin: 0;
        font-size: 14px;
        color: #8b949e;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-live="polite">
      <div class="boot-inner">
        <img src="./LogStudio_Logo.png" alt="LogStudio" width="96" height="96" />
        <div class="boot-brand">LogStudio</div>
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-status">Starting…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
